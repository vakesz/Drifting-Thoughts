name: DriftingThoughts

# ============================================
# VERSION & IDENTITY
# ============================================
version: &version 0.1.0
buildNumber: &buildNumber 1
bundleId: &bundleId com.vakesz.driftingthought
teamId: &teamId H8W5DK3FN2

# ============================================
# PROJECT OPTIONS
# ============================================
options:
  deploymentTarget:
    iOS: 18.0
  groupSortPosition: top
  createIntermediateGroups: true
  generateEmptyDirectories: false

# ============================================
# BUILD CONFIGURATIONS
# ============================================
configs:
  Debug: debug
  Release: release

fileGroups:
  - .swiftlint.yml
  - .gitignore
  - Makefile
  - project.yml
  - README.md

# ============================================
# PROJECT-WIDE BUILD SETTINGS
# ============================================
settings:
  base:
    # Swift Language
    SWIFT_VERSION: 6.0
    SWIFT_ENFORCE_EXCLUSIVE_ACCESS: full
    SWIFT_EMIT_LOC_STRINGS: YES
    GENERATE_STRING_CATALOG_SWIFT_SYMBOLS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

    # Platform & Deployment
    TARGETED_DEVICE_FAMILY: "1,2"

    # Security
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGNING_ALLOWED: YES

    # Code Quality - Treat Warnings as Errors
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES

    # Code Quality - Static Analyzer (beyond defaults)
    CLANG_ANALYZER_SECURITY_FLOATLOOPCOUNTER: YES
    CLANG_ANALYZER_SECURITY_INSECUREAPI_UNCHECKEDRETURN: YES

    # Localizability Analysis (Strict)
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    CLANG_ANALYZER_LOCALIZABILITY_MISSING_LOCALIZABLE: YES

    # Build Optimization
    DEAD_CODE_STRIPPING: YES
    ENABLE_MODULE_VERIFIER: YES
    MODULE_VERIFIER_SUPPORTED_LANGUAGES: "objective-c objective-c++"
    MODULE_VERIFIER_SUPPORTED_LANGUAGE_STANDARDS: "gnu11 gnu++20"

    # Modern Xcode Features
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_PREVIEWS: YES

    # Modern Localization
    LOCALIZED_STRING_MACRO_NAMES: NSLocalizedString CFCopyLocalizedString String(localized:)
    LOCALIZED_STRING_SWIFTUI_SUPPORT: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

    # Additional Modern Settings (iOS 18 / Xcode 16)
    SWIFT_EMIT_CONST_VALUE: YES
    SWIFT_EMIT_DOC_COMMENT: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES

  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
      SWIFT_COMPILATION_MODE: singlefile
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      DEBUG_INFORMATION_FORMAT: dwarf
      GCC_OPTIMIZATION_LEVEL: "0"
      COPY_PHASE_STRIP: NO
      STRIP_INSTALLED_PRODUCT: NO
      DEPLOYMENT_POSTPROCESSING: NO

    Release:
      ONLY_ACTIVE_ARCH: NO
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      GCC_OPTIMIZATION_LEVEL: "s"
      LLVM_LTO: monolithic
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      DWARF_DSYM_FOLDER_PATH: "$(CONFIGURATION_BUILD_DIR)"
      GCC_GENERATE_DEBUGGING_SYMBOLS: YES
      COPY_PHASE_STRIP: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: "all"
      STRIP_SWIFT_SYMBOLS: YES
      DEPLOYMENT_POSTPROCESSING: YES
      SEPARATE_STRIP: YES
      GCC_UNROLL_LOOPS: YES
      GCC_FAST_MATH: NO
      ASSETCATALOG_COMPILER_OPTIMIZATION: "time"
      VALIDATE_PRODUCT: YES

# ============================================
# TARGETS
# ============================================
targets:
  # ==========================================
  # MAIN APPLICATION TARGET
  # ==========================================
  DriftingThoughts:
    type: application
    platform: iOS

    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Resources
      - path: Supporting

    settings:
      base:
        # Product Identity
        PRODUCT_NAME: DriftingThoughts
        PRODUCT_BUNDLE_IDENTIFIER: *bundleId
        MARKETING_VERSION: *version
        CURRENT_PROJECT_VERSION: *buildNumber

        # Code Signing
        DEVELOPMENT_TEAM: *teamId
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

        # Asset Catalog
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
        GENERATE_ASSET_SYMBOLS: YES

        # Distribution
        SKIP_INSTALL: NO
        INSTALL_PATH: "$(LOCAL_APPS_DIR)"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES

    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Drifting Thoughts
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
